# GRACE on Qwen3.8-27B — UNTESTED.
# inner_params uses the language_model prefix (same as WISE / qwen3vl).
alg_name: "GRACE"
model_name: "./hugging_cache/Qwen3.8-27B"
device: 0

inner_params:
- model.language_model.layers[53].mlp.down_proj.weight

edit_lr: 1.0
n_iter: 50
eps: 5.0
dist_fn: euc # euc, mmd, cos
val_init: cold # cold, warm
val_train: sgd # sgd, pert
val_reg: None # early
reg: early_stop # early_stop
replacement: replace_last # replace_last, replace_all, replace_prompt
eps_expand: coverage # , moving_avg, decay
num_pert: 8 # only matters when using perturbation training
dropout: 0.0
