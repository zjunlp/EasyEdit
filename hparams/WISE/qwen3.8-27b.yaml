alg_name: "WISE"
model_name: "./hugging_cache/Qwen3.8-27B"
device: 0

mask_ratio: 0.2
edit_lr: 0.1
n_iter: 70
norm_constraint: 0.01
act_margin: [5.0, 20.0, 10.0]
act_ratio: 1.1
save_freq: 500
merge_freq: 1000
merge_alg: 'ties'
objective_optimization: 'only_label'
inner_params:
- model.layers[23].mlp.down_proj.weight

densities: 0.53
weights: 1.0
retrieve: True
replay: False
model_parallel: False
use_chat_template: True
# Use the same chat template for preservation samples in loc_prompts.
padding_side: right
enable_thinking: false
