# WISE on Qwen3.8-27B (qwen3_5: VL shell + 64-layer hybrid-attention LM)
# Module path (verified): model.language_model.layers.{}.mlp.down_proj
# Layer 53 is a GDN / linear_attention layer at ~83% depth (WISE convention).
# Layer 29 (~45% depth) changes teacher-forcing metrics but not free generation.
#
# PR-1 acceptance: load + chat generate + module paths. Generation-flip of
# WISE is a PR-2 criterion (right padding + loc fix + enable_thinking=false).
alg_name: "WISE"
model_name: "./hugging_cache/Qwen3.8-27B"
device: 0

mask_ratio: 0.2
edit_lr: 1.0
n_iter: 70
norm_constraint: 1.0
act_margin: [5.0, 20.0, 10.0] # alpha, beta, gamma
act_ratio: 0.88
save_freq: 500
merge_freq: 1000
merge_alg: 'ties'
objective_optimization: 'only_label'
inner_params:
- model.language_model.layers[53].mlp.down_proj.weight

## alternative: WISE-Merge, WISE-Retrieve

# for merge (if merge)
densities: 0.53
weights: 1.0

# for retrieve (if retrieve, pls set to True)
retrieve: True
replay: False

model_parallel: False
use_chat_template: True

# for save and load
# save_path: "./wise_checkpoint/wise.pt"
# load_path: "./wise_checkpoint/wise.pt"
